version: "3.8"

services:
  # --- REVERSE PROXY (Le Portier) ---
  traefik:
    image: traefik:v2.10
    container_name: iot_traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # Points d'entrée
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.influxdb.address=:8086"

      # Redirection Globale HTTP -> HTTPS (Pour le domaine)
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"

      # Certificats SSL (HTTP Challenge - Port 80 ouvert)
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"

      # --- PASSAGE EN PROD (Ligne Staging commentée) ---
      # Si tu as encore des soucis de certificat, décommente la ligne ci-dessous.
      # - "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"

      - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8086:8086"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt:/letsencrypt

  # --- DYNAMIC DNS ---
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: iot_duckdns
    restart: always
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
    volumes:
      - ./duckdns/config:/config

  # --- BASE DE DONNÉES ---
  influxdb:
    image: influxdb:2.7
    container_name: iot_influxdb
    restart: always
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_INIT_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_INIT_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
    env_file: .env
    labels:
      - "traefik.enable=true"
      # Route pour l'accès distant sécurisé (Port 8086)
      - "traefik.http.routers.influxdb.entrypoints=influxdb"
      - "traefik.http.routers.influxdb.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.influxdb.tls.certresolver=myresolver"
      - "traefik.http.services.influxdb.loadbalancer.server.port=8086"

  # --- WEB APP (EcoGuardian) ---
  ecoguardian:
    build: ./ecoguardian-plant-monitor
    container_name: iot_ecoguardian
    restart: always
    depends_on:
      - influxdb
    labels:
      - "traefik.enable=true"

      # ROUTEUR 1 : Accès Internet (HTTPS / Domaine)
      - "traefik.http.routers.ecoguardian-secure.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.ecoguardian-secure.entrypoints=websecure"
      - "traefik.http.routers.ecoguardian-secure.tls.certresolver=myresolver"

      # ROUTEUR 2 : Accès Local (HTTP / IP ou Localhost) - Pour éviter la 404 en local
      # Pas de redirection HTTPS ici pour ne pas bloquer l'accès local
      - "traefik.http.routers.ecoguardian-local.rule=Host(`${LOCAL_IP}`) || Host(`localhost`)"
      - "traefik.http.routers.ecoguardian-local.entrypoints=web"

      # SERVICE : Où envoyer les requêtes ?
      # IMPORTANT : C'est le port interne du conteneur (souvent 80 pour Nginx/Apache/Node)
      # SERVICE : Où envoyer les requêtes ?
      # IMPORTANT : C'est le port interne du conteneur (souvent 80 pour Nginx/Apache/Node)
      - "traefik.http.services.ecoguardian.loadbalancer.server.port=80"

      # --- MIDDLEWARE AUTH (Authelia) ---
      - "traefik.http.routers.ecoguardian-secure.middlewares=authelia"
      - "traefik.http.routers.ecoguardian-local.middlewares=authelia"

      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/verify?rd=https://ecoguardian.duckdns.org/authelia/"
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"

  # --- AUTHELIA ---
  authelia:
    image: authelia/authelia:latest
    container_name: iot_authelia
    restart: always
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml
      - ./authelia/users_database.yml:/config/users_database.yml
      - ./authelia/assets:/config/assets
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`ecoguardian.duckdns.org`) && PathPrefix(`/authelia`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls.certresolver=myresolver"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"

  # --- GRAFANA ---
  grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana
    restart: always
    volumes:
      - ./grafana/data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://ecoguardian.duckdns.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`ecoguardian.duckdns.org`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
